name: ci

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 6 * * *"   # nightly: catches upstream torch/datasets breakage

jobs:
  cpu-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: install (CPU torch, no triton)
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: reference + shape correctness
        # Triton paths skip on CPU; the reference path still catches shape,
        # broadcasting, masking and ignore_index bugs, which is most of them.
        run: pytest tests/ -q
      - name: lint
        run: ruff check nuvla_forge tests

  gpu-benchmarks:
    # Attach a self-hosted runner on the GPU box to keep RESULTS.md current:
    #   gh runner configure --labels gpu
    runs-on: [self-hosted, gpu]
    if: github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e ".[dev,gpu,data]"
      - run: pytest tests/ -q
      - run: bash scripts/run_all_benchmarks.sh
      - name: commit refreshed results
        run: |
          git config user.name  "nuvla-forge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f RESULTS.md reports/ || true
          git commit -m "bench: nightly refresh" || echo "no change"
          git push || true
